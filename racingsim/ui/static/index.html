<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>racingsim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d6402b'/%3E%3Cpath d='M6 22h20M8 22l3-9h10l3 9' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <a class="brand" href="#/"><span class="brand-mark">R</span><span>racingsim</span></a>
      <div id="player-card"></div>
      <nav id="nav">
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/career" data-nav="career">My Career</a>
        <a href="#/offseason" data-nav="offseason" id="nav-offseason">Off-season</a>
        <a href="#/myseries" data-nav="myseries">My Series</a>
        <a href="#/garage" data-nav="garage">Garage</a>
        <a href="#/jewels" data-nav="jewels">Crown Jewels</a>
        <div class="nav-sep">World</div>
        <a href="#/pyramid" data-nav="pyramid">Racing Pyramid</a>
        <a href="#/drivers" data-nav="drivers">Drivers</a>
        <a href="#/staff" data-nav="staff">Staff</a>
        <a href="#/tracks" data-nav="tracks">Tracks</a>
        <a href="#/news" data-nav="news">News Wire</a>
        <a href="#/encyclopedia" data-nav="encyclopedia">Encyclopedia</a>
        <div class="nav-sep">Game</div>
        <a href="#/saves" data-nav="saves">Save / Load</a>
        <a href="#/new" data-nav="new">New Career</a>
      </nav>
      <button id="theme-toggle" class="ghost small" title="Toggle light/dark">◐ Theme</button>
    </aside>
    <div id="main">
      <header id="topbar">
        <div id="clock"></div>
        <div id="sim-controls"></div>
      </header>
      <div id="toast" hidden></div>
      <main id="view"><div class="loading">Loading…</div></main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
