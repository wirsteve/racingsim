name: Build app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # only used to attach builds to a release on v* tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: racingsim-windows.zip
          - os: macos-latest
            asset: racingsim-macos-apple-silicon.zip
          - os: ubuntu-latest
            asset: racingsim-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: python tools/build_app.py
      - name: Smoke test the built app
        shell: bash
        env:
          RACINGSIM_HOME: ${{ runner.temp }}/rs-home
        run: |
          exe=dist/racingsim; [ -f dist/racingsim.exe ] && exe=dist/racingsim.exe
          "$exe" > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/status && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8765/api/new -d '{"first":"CI","last":"Test","region":"NC","age":13,"discipline":"stock_car","background":"comfortable","start_year":1996,"scale":0.2}' > /dev/null
          curl -sf -X POST http://127.0.0.1:8765/api/sim -d '{"until":"week"}' > /dev/null
          curl -sf http://127.0.0.1:8765/api/series/cup_series | grep -q "Winston Cup"
          echo "smoke test passed"
      - name: Package
        shell: bash
        run: |
          cp tools/PLAY.txt dist/
          cd dist
          case "${{ matrix.asset }}" in
            *.zip) if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../${{ matrix.asset }}" racingsim.exe PLAY.txt; else zip -9 "../${{ matrix.asset }}" racingsim PLAY.txt; fi ;;
            *.tar.gz) tar -czf "../${{ matrix.asset }}" racingsim PLAY.txt ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
